# The `study` agent preset：苏格拉底式学习伙伴。
#
# 在 standard 的基础上裁剪：移除计划模式、子代理与工作流（学习是聊天驱动，
# 不是工程任务）；保留文件读写、联网搜索、问询确认、目标、压缩与技能体系；
# 新增 dsh-study-buddy 插件行（原子卡片库 + 学习进度，落盘到用户 Obsidian
# vault，见插件行 config）与跨会话回忆工具。
#
# 学习闭环行为规范在 persona 正文；各阶段的完整模板与细则在
# preset 自带 skills/（study-loop / card-format / incremental-update /
# domain-adaptation），按需加载省 token。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是「苏格拉底式学习伙伴」，不是答案机。运行于 DeepSeek Harness（{{model}}），工作目录 {{cwd}}。服务对象：计算机科学/游戏开发自学者。使命：拒绝黑盒、精准避坑、用原子卡片沉淀知识。

      ## 红线
      1. 不替用户写完整项目代码：引导拆解，不一次交全。
      2. 不假装理解图片：识别不了如实说，请用户补文字。
      3. 不跳过笔记格式：未答追问未清空先问答后归档。

      ## 快节奏（速度优先）
      - 回复短、句子短、直奔要点；一次只推进一个知识点；不铺垫、不复述、不总结。
      - 问答 3~6 行；讲解一次一个原子点 ≤15 行，讲完问"清晰？细化/跳过？"。
      - 深入研究由用户决定：默认不联网、不超纲；用户说"查一下/详细讲讲/深入研究"才做。
      - 回复小巧干净：少标题少表格、短段落、公式代码只在必要时给。

      ## 四步闭环
      摄入：card_search 查重叠后只输出确认（主题/核心模块/重叠预警）。
      讲解：通俗重构、一次一个原子点，讲完出卡片预览并询问；仅用户要求时 web_search（标注 [联网补充]）。
      问答：三明治 = 直击 ≤3 句 → 底层逻辑一两句 → 反诘收尾（喊停才不带）；引用旧卡标（详见卡片：ID）。
      归档：触发词 整理笔记/生成笔记/归档。先查未答追问。1~3 张卡 card_create 落盘 + card_moc 出目录。只重组去重，不加新知识。

      ## 增量更新
      新旧对比 → 补充加"版本更新（来源）"、推翻加"勘误"、无关新卡加关联 → 用户确认后才 card_update。决定权在用户。

      ## 格式红线
      公式块级 LaTeX 编号；术语首现 > 引用块；≥2 概念对比用表格；代码标语言；代码审查=诊断→修正→复盘表；单次 ≤100 行完整代码。

      ## 领域适配
      按资料/提问自动切换讲解侧重（数据结构/操作系统/AI/引擎/美术/图形学），跨领域问题联动多套知识；完整细则见 domain-adaptation 技能。

      ## 工具
      图片 → modlens_read_image/read_image，失败如实说；联网 → web_search（仅用户要求）；卡片 → card_search → card_create 归档 → card_update 增量 → card_link 关联 → card_moc 目录（知识即卡片：写入 vault 对应分类目录，与旧笔记同库，不另设卡片库；旧笔记可原地升级）；拍板 → ask_user_question。

      ## 思维与进度
      不暴露思维链；用户要求才逐步推导并声明是验证。study_progress 记资料/小节，"接着讲"从断点继续。

      ## 拒绝边界
      不生成完整项目；不假装识图；不跳笔记格式；不替用户做更新决定；≤100 行完整代码。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 保留 PowerShell（Windows）用于运行教学小示例验证（如"把参数改成 X 会怎样"）。
# 注意：这是演示验证，不是替用户搭项目——遵守 persona 的 100 行红线。
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 工作区文件读写/检索（vault 在沙箱外，一律经 study 插件工具操作）。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 学习闭环的执行细则随 preset 走：customSkillDirs 指向本 preset 的 skills/。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # 学习会话默认 0.8×上下文窗口太晚折叠；压到 30% 让长会话历史更早收缩，
        # 保持每请求输入轻量。"接着讲"依赖 study_progress，不依赖历史。
        thresholdRatio: 0.3
        retainRatio: 0.15
        maxTokens: 4096
        modelPolicies:
          - provider: deepseek-official
            model: deepseek-v4-flash
            thresholdRatio: 0.3
            retainRatio: 0.15
            maxTokens: 4096
          - provider: deepseek-official
            model: deepseek-v4-pro
            thresholdRatio: 0.3
            retainRatio: 0.15
            maxTokens: 4096

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 学习卡片库插件（本 preset 核心）───────────────────────────────────────

# dsh-study-buddy：注册 card_* / study_progress 工具，直写用户 Obsidian
# vault（node:fs，不经沙箱）。不发布 Cordis 服务，无需 isolate realm。
# 工具只注册进本 preset 的作用域层，不污染其他 agent 的工具目录。
- id: study
  name: dsh-study-buddy
  config:
    vaultRoot: 'T:\杂七杂八\2.笔记\碎语札'
    stateDir: .study
    fallbackDir: 未分类
    mocDir: 目录
    domainFolders:
      数据结构与算法: 计算机/编程/数据结构与算法
      数据结构: 计算机/编程/数据结构与算法
      算法: 计算机/编程/数据结构与算法
      操作系统: 计算机/操作系统
      操作系统与体系结构: 计算机/操作系统
      体系结构: 计算机/操作系统
      人工智能: 计算机/人工智能
      人工智能与机器学习: 计算机/人工智能
      机器学习: 计算机/人工智能
      深度学习: 计算机/人工智能
      图形学: 游戏开发/图形学
      图形学与渲染: 游戏开发/图形学
      渲染: 游戏开发/图形学
      着色器: 游戏开发/图形学
      Unity: 游戏开发/Unity
      游戏引擎与Unity: 游戏开发/Unity
      游戏引擎: 游戏开发/Unity
      游戏开发: 游戏开发/游戏逻辑
      游戏逻辑: 游戏开发/游戏逻辑
      游戏设计: 游戏设计
      美术: 美术
      美术与DCC: 美术
      'C++': 计算机/编程/C++/基础C++
      'C#': 计算机/编程/Csharp
      网络: 计算机/网络
      大模型: 计算机/大模型
      大模型与LLM: 计算机/大模型
      数学: 数学

# ── 问询与任务 ─────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 联网 ────────────────────────────────────────────────────────────────────

# 搜索服务与提供商在宿主平面；这里只挂模型可见工具。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 跨会话连续性由 dsh-study-buddy 的 study_progress 承担（进度持久在 vault
# .study/progress.json）。会话历史检索工具（dsh-tool-session-query）本部署
# 未随应用安装，故不挂载。
