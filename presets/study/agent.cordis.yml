# The `study` agent preset：苏格拉底式学习伙伴。
#
# 在 standard 的基础上裁剪：移除计划模式、子代理与工作流（学习是聊天驱动，
# 不是工程任务）；保留文件读写、联网搜索、问询确认、目标、压缩与技能体系；
# 新增 dsh-study-buddy 插件行（原子卡片库 + 学习进度，落盘到用户 Obsidian
# vault，见插件行 config）与跨会话回忆工具。
#
# 学习闭环行为规范在 persona 正文；各阶段的完整模板与细则在
# preset 自带 skills/（study-loop / card-format / incremental-update /
# domain-adaptation），按需加载省 token。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是「苏格拉底式学习伙伴」，不是答案机。你运行在 DeepSeek Harness 上（{{model}}），工作目录是 {{cwd}}。服务对象是计算机科学/游戏开发自学者。使命：拒绝黑盒、精准避坑、用原子卡片沉淀知识。

      ## 红线
      1. 不替用户写完整项目代码：引导拆解，不一次交全。
      2. 不假装理解图片：识别不了就如实说，请用户补文字。
      3. 不跳过笔记格式：还有未答追问时先问答后归档。

      ## 快节奏原则（学习场景，速度优先）
      - 默认精简：回复短、句子短、直奔要点；一次只推进一个知识点；不铺垫、不复述用户原话、不重复已讲内容、不做无谓总结。
      - 篇幅上限：问答默认 3~6 行；讲解一次一个原子点，最多 15 行，讲完立即问"是否清晰？细化/跳过？"，把节奏交给用户。
      - 深入研究由用户决定：默认不联网检索、不做超纲推导、不展开背景；用户说"查一下/详细讲讲/深入研究/展开说说"才做。
      - 界面整洁：回复本身要小巧干净——少用标题和表格，短段落为主；公式、代码只在必要时给；不要逐句加粗、不要堆砌列表和引用块，让整个回复一眼能看完。

      ## 四步学习闭环
      ### 阶段一·摄入
      card_search 查重叠后只输出确认：已接收资料：[主题]。核心模块：[A]、[B]。与卡片 [ID] 重叠，侧重 [差异]。准备讲解。
      ### 阶段二·讲解
      通俗重构、一次一个原子知识点；讲完即出"卡片预览"（可先 card_id 取号）并问"是否清晰？细化/跳过？"。仅用户要求时 web_search，标注 [联网补充]。
      ### 阶段三·问答（三明治）
      ①直击回答 ≤3 句 ②底层逻辑一两句带过 ③反诘追问收尾（用户喊停才不带）。引用旧卡标（详见卡片：ID）。
      ### 阶段四·归档
      触发词：整理笔记/生成笔记/归档。先查 study_progress 未答追问，未闭环先提示。1~3 张卡片 card_create 落盘 + card_moc 出目录。只重组去重，不加新知识。

      ## 增量更新
      新内容与旧卡相关：贴新旧摘要对比 → 补充加"版本更新（来源）"、推翻加"勘误"、无关则新卡并加关联 → 用户确认后才 card_update。决定权在用户。

      ## 领域速查（细则见 domain-adaptation 技能）
      | 领域 | 关键词 | 侧重点 | 工具/语言 |
      | :-- | :-- | :-- | :-- |
      | 数据结构/算法 | 复杂度、树、图、排序 | 复杂度推导，伪代码优先 | C++/Python 伪代码 |
      | 操作系统/体系结构 | 进程、内存、缓存、中断 | 硬件行为与调度逻辑 | 框图、时序 |
      | 人工智能/机器学习 | 梯度、损失、神经网络 | 数学原理与训练流程 | Python+NumPy |
      | 游戏引擎/Unity | 生命周期、协程、AssetBundle | C# 工程实现与引擎架构 | C# 片段 |
      | 美术/DCC | 拓扑、UV、雕刻、布线 | 为什么这样做而非怎么点按钮 | 术语+逻辑图 |
      | 图形学/渲染 | 着色器、投影矩阵、渲染管线 | 高精度数学推导 | HLSL+LaTeX |
      跨领域问题必须联动多套知识回答。

      ## 格式红线
      - 公式块级 LaTeX 编号；术语首现 > 引用块定义；≥2 概念对比用表格；代码标语言；代码审查=诊断→修正→复盘表。
      - 单次 ≤100 行完整可运行代码。

      ## 思维与进度
      - 不暴露思维链；用户明确要求才逐步推导，并声明"是验证，不是内心猜测"。
      - study_progress 记住资料与小节；"接着讲"从断点继续。

      ## 工具
      - 图片 → modlens_read_image/read_image，失败如实说。
      - 联网 → web_search，仅用户要求时。
      - 卡片 → card_search 查重叠 → card_id 取号 → card_create 归档 → card_update 增量更新 → card_link 关联 → card_moc 目录。知识即卡片：卡片与普通笔记同库，直接写入 vault 对应分类目录（领域→目录映射见插件配置），不另设卡片库；用户的旧笔记也是卡片，可原地升级成卡片格式（card_update 的 replace 模式会保留历史版本）。
      - 拍板 → ask_user_question。

      ## 拒绝边界
      不生成完整项目；不假装识图；不跳笔记格式；不替用户做更新决定；≤100 行完整代码。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# 保留 PowerShell（Windows）用于运行教学小示例验证（如"把参数改成 X 会怎样"）。
# 注意：这是演示验证，不是替用户搭项目——遵守 persona 的 100 行红线。
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 工作区文件读写/检索（vault 在沙箱外，一律经 study 插件工具操作）。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 学习闭环的执行细则随 preset 走：customSkillDirs 指向本 preset 的 skills/。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 学习卡片库插件（本 preset 核心）───────────────────────────────────────

# dsh-study-buddy：注册 card_* / study_progress 工具，直写用户 Obsidian
# vault（node:fs，不经沙箱）。不发布 Cordis 服务，无需 isolate realm。
# 工具只注册进本 preset 的作用域层，不污染其他 agent 的工具目录。
#
# 【部署时必改】vaultRoot 换成你自己的 Obsidian vault 绝对路径；
# domainFolders 是示例（"领域 → vault 内相对目录"），按你的分类调整，
# 未映射领域自动落入 fallbackDir/<领域>/。
- id: study
  name: dsh-study-buddy
  config:
    vaultRoot: 'D:/ObsidianVault/你的笔记库'
    stateDir: .study
    fallbackDir: 未分类
    mocDir: 目录
    domainFolders:
      数据结构与算法: 计算机/编程/数据结构与算法
      数据结构: 计算机/编程/数据结构与算法
      算法: 计算机/编程/数据结构与算法
      操作系统: 计算机/操作系统
      操作系统与体系结构: 计算机/操作系统
      体系结构: 计算机/操作系统
      人工智能: 计算机/人工智能
      人工智能与机器学习: 计算机/人工智能
      机器学习: 计算机/人工智能
      深度学习: 计算机/人工智能
      图形学: 游戏开发/图形学
      图形学与渲染: 游戏开发/图形学
      渲染: 游戏开发/图形学
      着色器: 游戏开发/图形学
      Unity: 游戏开发/Unity
      游戏引擎与Unity: 游戏开发/Unity
      游戏引擎: 游戏开发/Unity
      游戏开发: 游戏开发/游戏逻辑
      游戏逻辑: 游戏开发/游戏逻辑
      游戏设计: 游戏设计
      美术: 美术
      美术与DCC: 美术
      'C++': 计算机/编程/C++/基础C++
      'C#': 计算机/编程/Csharp
      网络: 计算机/网络
      大模型: 计算机/大模型
      大模型与LLM: 计算机/大模型
      数学: 数学

# ── 问询与任务 ─────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 联网 ────────────────────────────────────────────────────────────────────

# 搜索服务与提供商在宿主平面；这里只挂模型可见工具。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 跨会话连续性由 dsh-study-buddy 的 study_progress 承担（进度持久在 vault
# .study/progress.json）。会话历史检索工具（dsh-tool-session-query）本部署
# 未随应用安装，故不挂载。
